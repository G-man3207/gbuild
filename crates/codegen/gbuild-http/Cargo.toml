[package]
license = "Apache-2.0"
name = "gbuild-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the gBuild CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
gbuild-auth = { workspace = true, features = ["middleware"] }
gbuild-sampler = { path = "../gbuild-sampler" }
gbuild-telemetry = { workspace = true }
gbuild-version = { workspace = true }
gbuild-workspace = { workspace = true }

[lints]
workspace = true
